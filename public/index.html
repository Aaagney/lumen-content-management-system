<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Articles - Lumen</title>
  <meta name="description" content="Explore curated long-form writing across science, technology, and the world.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container header-inner">
      <!-- Logo -->
      <a href="index.html" class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M21 4H3c-1.1 0-2 .9-2 2v12c0 1.1 0.9 2 2 2h18c1.1 0 2-0.9 2-2V6c0-1.1-0.9-2-2-2zM3 6h8v12H3V6zm18 12h-8V6h8v12z"/>
          <path d="M5 8h4v2H5V8zm0 4h4v2H5v-2zm10-4h4v2h-4V8zm0 4h4v2h-4v-2z"/>
        </svg>
        <span>Lumen</span>
      </a>

      <!-- Center Links -->
      <nav class="nav-links">
        <a href="#" class="nav-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Home
        </a>
        <a href="index.html" class="nav-item active">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          Browse
        </a>
        <a href="#" id="writeLink" class="nav-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
          </svg>
          Write
        </a>
        <a href="#" class="nav-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          Profile
        </a>
      </nav>

      <!-- Right Actions -->
      <div class="header-right">
        <!-- User Simulator Dropdown -->
        <select id="userDropdown" class="user-selector">
          <option value="Priya Mehta">Priya Mehta (author)</option>
          <option value="Thomas Okeke">Thomas Okeke (author)</option>
          <option value="Amara Silva">Amara Silva (admin)</option>
          <option value="Lena Kaufmann" selected>Lena Kaufmann (reader)</option>
        </select>

        <!-- Notification Bell -->
        <button class="bell-btn" aria-label="Notifications">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span class="bell-dot"></span>
        </button>

        <!-- User Avatar Circle -->
        <div id="userAvatar" class="user-avatar">LK</div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      
      <!-- Page Title Section -->
      <div class="page-title-section">
        <h1 class="page-title">Browse Articles</h1>
        <p class="page-subtitle">Explore curated long-form writing across science, technology, and the world.</p>
      </div>

      <!-- Controls Row: Search & Filters -->
      <div class="controls-row">
        <!-- Search bar -->
        <div class="search-wrapper">
          <svg class="search-icon" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search articles...">
        </div>

        <!-- Category pills -->
        <div class="filter-pills">
          <button class="pill active" data-category="All">All</button>
          <button class="pill" data-category="Science">Science</button>
          <button class="pill" data-category="Technology">Technology</button>
          <button class="pill" data-category="Environment">Environment</button>
          <button class="pill" data-category="Health">Health</button>
          <button class="pill" data-category="History">History</button>
        </div>
      </div>

      <!-- Articles Grid -->
      <div id="articlesGrid" class="articles-grid">
        <!-- Articles will be dynamically loaded here -->
      </div>

      <!-- No Results Section -->
      <div id="noResults" class="no-results">
        <svg class="no-results-icon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <h2 class="no-results-title">No articles found</h2>
        <p class="no-results-desc">We couldn't find any articles matching your search query or selected category.</p>
      </div>

    </div>
  </main>

  <!-- Cookies Badge -->
  <div class="cookie-badge">
    Manage cookies or opt out
  </div>

  <!-- Help & Resources Widget -->
  <button class="help-floating-btn">
    Help and resources
    <span class="badge">?</span>
  </button>

  <script src="js/browse.js"></script>
</body>
</html>
