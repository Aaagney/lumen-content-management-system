<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Detail - Lumen</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container header-inner">
      <!-- Logo -->
      <a href="index.html" class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M21 4H3c-1.1 0-2 .9-2 2v12c0 1.1 0.9 2 2 2h18c1.1 0 2-0.9 2-2V6c0-1.1-0.9-2-2-2zM3 6h8v12H3V6zm18 12h-8V6h8v12z"/>
          <path d="M5 8h4v2H5V8zm0 4h4v2H5v-2zm10-4h4v2h-4V8zm0 4h4v2h-4v-2z"/>
        </svg>
        <span>Lumen</span>
      </a>

      <!-- Center Links -->
      <nav class="nav-links">
        <a href="#" class="nav-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Home
        </a>
        <a href="index.html" class="nav-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          Browse
        </a>
        <a href="#" id="writeLink" class="nav-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
          </svg>
          Write
        </a>
        <a href="#" class="nav-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          Profile
        </a>
      </nav>

      <!-- Right Actions -->
      <div class="header-right">
        <!-- User Simulator Dropdown -->
        <select id="userDropdown" class="user-selector">
          <option value="Priya Mehta">Priya Mehta (author)</option>
          <option value="Thomas Okeke">Thomas Okeke (author)</option>
          <option value="Amara Silva">Amara Silva (admin)</option>
          <option value="Lena Kaufmann" selected>Lena Kaufmann (reader)</option>
        </select>

        <!-- Notification Bell -->
        <button class="bell-btn" aria-label="Notifications">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span class="bell-dot"></span>
        </button>

        <!-- User Avatar Circle -->
        <div id="userAvatar" class="user-avatar">LK</div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="detail-container">
      
      <!-- Back Button -->
      <a href="index.html" class="back-btn">
        <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Back to articles
      </a>

      <!-- Article Header details -->
      <div id="detailHeader">
        <div class="detail-header-meta">
          <span id="detailCategory" class="detail-category">Category</span>
          <span class="detail-meta-divider">&middot;</span>
          <span id="detailReadingTime" class="detail-reading-time">X min read</span>
          <span class="detail-meta-divider">&middot;</span>
          <span id="detailDate" class="detail-date">Date</span>
        </div>
        
        <h1 id="detailTitle" class="detail-title">Loading Article...</h1>
        <p id="detailDesc" class="detail-desc"></p>
      </div>

      <!-- Author Information block -->
      <div class="detail-author-block">
        <div class="detail-author-profile">
          <div id="detailAuthorAvatar" class="detail-author-avatar">A</div>
          <div class="detail-author-text">
            <span id="detailAuthorName" class="detail-author-name">Author Name</span>
            <span id="detailAuthorBio" class="detail-author-bio">Author Bio</span>
          </div>
        </div>
        
        <div class="detail-stats">
          <div class="stat-item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
            <span id="detailViews">0</span>
          </div>
          <div class="stat-item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.722l1.293-7a2 2 0 00-2-2.278H14zM7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/>
            </svg>
            <span id="detailLikes">0</span>
          </div>
        </div>
      </div>

      <!-- Article Image -->
      <div class="detail-img-wrapper">
        <img id="detailImg" class="detail-img" src="" alt="Article image">
      </div>

      <!-- Article body content -->
      <article id="detailBody" class="detail-body">
        <!-- Paragraphs will be dynamically inserted here -->
      </article>

      <!-- Tags Section -->
      <div id="detailTags" class="detail-tags-section">
        <!-- Tag pills will go here -->
      </div>

      <!-- Quiz Card (under content) -->
      <div id="quizCard" class="quiz-card">
        <div class="quiz-icon-wrapper">
          <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <h2 class="quiz-title">Test Your Understanding</h2>
        <p id="quizSubtitle" class="quiz-subtitle">Test Your Knowledge — 3 questions</p>
        <button class="quiz-btn">Take the Quiz</button>
      </div>

    </div>
  </main>

  <!-- Cookies Badge -->
  <div class="cookie-badge">
    Manage cookies or opt out
  </div>

  <!-- Help & Resources Widget -->
  <button class="help-floating-btn">
    Help and resources
    <span class="badge">?</span>
  </button>

  <script src="js/article.js"></script>
</body>
</html>
